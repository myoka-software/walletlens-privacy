<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WalletLens Support</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f5f5f7;
            color: #1d1d1f;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .container {
            background: #ffffff;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            max-width: 500px;
            width: 100%;
        }
        h1 {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 16px;
        }
        p {
            font-size: 17px;
            line-height: 1.47059;
            color: #86868b;
            margin-bottom: 32px;
        }
        .button {
            display: inline-block;
            background-color: #0071e3;
            color: #ffffff;
            font-size: 17px;
            font-weight: 400;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 980px;
            transition: background-color 0.3s;
        }
        .button:hover {
            background-color: #0077ed;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>WalletLens Support</h1>
        <p>If you have any questions, suggestions, or need help with the app, please feel free to reach out. We are here to help!</p>
        <a href="mailto:myoka.help@gmail.com?subject=WalletLens%20Support" class="button">Contact Support</a>
    </div>
</body>
</html>
